name: "CI: Rust macOS unit"

on:
  pull_request:
    paths:
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/rust-toolchain.toml"
      - "libs/cua-driver/rust/crates/cua-driver-contract/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-macos/**"
      - ".github/workflows/ci-rust-macos.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/rust-toolchain.toml"
      - "libs/cua-driver/rust/crates/cua-driver-contract/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-macos/**"
      - ".github/workflows/ci-rust-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rust-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Rust macOS unit
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"
      - name: Check cua-driver-core formatting
        working-directory: libs/cua-driver/rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p cua-driver-core -- --check
      - name: Run cua-driver-core unit tests
        working-directory: libs/cua-driver/rust
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cua-driver-core --locked
      - name: Run platform-macos unit tests
        working-directory: libs/cua-driver/rust
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p platform-macos --locked
